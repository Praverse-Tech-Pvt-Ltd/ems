# NexGen EMS — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy to Render:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect your repo — Render reads this file and creates all services
#   4. After first deploy, manually set in Render dashboard:
#      - nexgen-api:  DATABASE_URL, DIRECT_URL, REDIS_URL, RESEND_API_KEY, FRONTEND_URL
#      - nexgen-web:  (auto-configured via fromService)
#      - nexgen-face: DATABASE_URL
#   5. Set RENDER_SELF_URL on nexgen-api to its own https URL (e.g. https://nexgen-api.onrender.com)

services:

  # ── NestJS API ────────────────────────────────────────────────────────────────
  - type: web
    name: nexgen-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

      # Set these manually in the Render dashboard after first deploy
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Set to this service's own URL (e.g. https://nexgen-api.onrender.com)
      # Used by keep-alive cron to prevent Render free-tier spin-down
      - key: RENDER_SELF_URL
        sync: false

      # Auto-generated secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Static values
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: uploads
      - key: RESEND_FROM_EMAIL
        value: noreply@nexgenpharma.com
      - key: RESEND_FROM_NAME
        value: NexGen Pharma EMS
      - key: BCRYPT_OTP_ROUNDS
        value: 8
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_OTP_MAX
        value: 3
      - key: RATE_LIMIT_OTP_WINDOW
        value: 1800
      - key: CRON_TOKEN_CLEANUP
        value: "0 2 * * *"

      # Face recognition service URL — pulled from nexgen-face service
      - key: FR_SERVICE_URL
        fromService:
          name: nexgen-face
          type: web
          property: hostURL

  # ── Next.js Web ───────────────────────────────────────────────────────────────
  - type: web
    name: nexgen-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    buildCommand: ""
    dockerCommand: ""
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: nexgen-api
          type: web
          property: hostURL

  # ── Python Face Recognition Service ──────────────────────────────────────────
  - type: web
    name: nexgen-face
    runtime: docker
    dockerfilePath: apps/face-service/Dockerfile
    dockerContext: apps/face-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # same Neon direct URL (no pgbouncer)
      - key: CONFIDENCE_THRESHOLD
        value: 0.55
