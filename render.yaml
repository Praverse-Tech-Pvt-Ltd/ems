# NexGen EMS — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub
#   2. render.com → New → Blueprint → connect repo
#   3. After first deploy, set the "sync: false" vars manually in the Render dashboard
#
# Frontend is hosted on Vercel — set NEXT_PUBLIC_API_URL there to the nexgen-api hostURL.

services:

  # ── NestJS API ────────────────────────────────────────────────────────────────
  - type: web
    name: nexgen-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

      # Set manually in Render dashboard after first deploy
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Set to this service's own URL to keep the free-tier instance alive
      - key: RENDER_SELF_URL
        sync: false
      # Set to the nexgen-face service URL once it is deployed
      - key: FACE_SERVICE_URL
        sync: false

      # Auto-generated secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Static values
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: uploads
      - key: RESEND_FROM_EMAIL
        value: nexgenpharmasolution@gmail.com
      - key: RESEND_FROM_NAME
        value: NexGen Pharma EMS
      - key: BCRYPT_OTP_ROUNDS
        value: 8
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_OTP_MAX
        value: 3
      - key: RATE_LIMIT_OTP_WINDOW
        value: 1800
      - key: CRON_TOKEN_CLEANUP
        value: "0 2 * * *"
      - key: RECOGNITION_THRESHOLD
        value: "0.5"
      - key: OFFICE_LAT
        value: "28.6139"
      - key: OFFICE_LNG
        value: "77.2090"
      - key: OFFICE_RADIUS_METERS
        value: "200"

  # ── Python Face Recognition Service ──────────────────────────────────────────
  # Requires Starter plan ($7/mo) — free tier spins down and dlib builds are heavy.
  # Build takes ~20 min on first deploy (dlib compiles from source).
  - type: web
    name: nexgen-face
    runtime: docker
    dockerfilePath: apps/face-service/Dockerfile
    dockerContext: apps/face-service
    plan: starter
    healthCheckPath: /health
    envVars:
      # Use the DIRECT (non-pooled) URL — psycopg2 needs persistent connections
      - key: DATABASE_URL
        sync: false
      - key: RECOGNITION_THRESHOLD
        value: "0.5"
