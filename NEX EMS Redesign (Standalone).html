            'fade-in': 'fadeIn 0.2s ease-out forwards',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.4' },

              '0%': { transform: 'translateX(20px)', opacity: '0' },

          {/* radial progress */}
          <div class="relative w-12 h-12 shrink-0">
            <svg class="w-full h-full" viewBox="0 0 36 36">
              <path class="text-slate-100 dark:text-slate-800" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path 
                class={`${color === 'indigo' ? 'text-indigo-500' : color === 'emerald' ? 'text-emerald-500' : color === 'rose' ? 'text-rose-500' : 'text-amber-500'}`} 
                stroke-width="3" 
                stroke-dasharray={`${pct}, 100`} 
                stroke-linecap="round" 
                stroke="currentColor" 
                fill="none" 
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" 
              />
            </svg>
            <div class="absolute inset-0 flex items-center justify-center text-[10px] font-bold font-mono">
              {Math.round(pct)}%
            </div>
          </div>
        </div>
      );
    }

    function PayslipRow({ month, net, status, refCode }) {
      return (
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 rounded-2xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50/50 dark:hover:bg-slate-900/10 transition-colors gap-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-indigo-500">receipt</span>
            </div>
            <div class="flex flex-col">
              <span class="font-bold text-xs text-slate-800 dark:text-white">Payslip — {month}</span>
              <span class="text-[10px] text-slate-400 font-mono">Reference: {refCode} | Net Payout: {net}</span>
            </div>
          </div>
          <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
            <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 text-[10px] font-bold uppercase tracking-wider">{status}</span>
            <button class="px-3 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-lg text-[10px] font-bold flex items-center gap-1 transition-colors">
              <span class="material-symbols-outlined text-sm">download</span> PDF
            </button>
          </div>
        </div>
      );
    }

    function WorkflowRow({ category, title, status, date }) {
      return (
        <div class="p-4 rounded-2xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50/50 dark:hover:bg-slate-900/10 transition-colors flex items-center justify-between">
          <div class="flex flex-col">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">{category}</span>
            <span class="text-xs font-bold text-slate-700 dark:text-slate-300 mt-0.5">{title}</span>
          </div>
          <div class="text-right flex flex-col items-end gap-1">
            <span class={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${status === 'Approved' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-amber-500/10 text-amber-500 border-amber-500/20'}`}>{status}</span>
            <span class="text-[9px] text-slate-400 font-mono">{date}</span>
          </div>
        </div>
      );
    }

    function ChannelRow({ name, unread, active }) {
      return (
        <button class={`w-full flex items-center justify-between p-2.5 rounded-xl text-xs font-semibold tracking-tight transition-colors ${active ? 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white' : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/40'}`}>
          <span>{name}</span>
          {unread && <span class="h-2 w-2 rounded-full bg-indigo-500"></span>}
        </button>
      );
    }

    function ChatMessage({ name, time, text, isMe }) {
      return (
        <div class={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
          <div class="flex items-center gap-2 text-[10px] text-slate-400 mb-0.5">
            <span class="font-bold">{name}</span>
            <span>-</span>
            <span class="font-mono">{time}</span>
          </div>
          <div class={`p-3 rounded-2xl max-w-[80%] text-xs font-medium ${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/50 dark:border-slate-700/50'}`}>
            {text}
          </div>
        </div>
      );
    }

    function DocRow({ name, status, date, size }) {
      return (
        <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-900/10">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-indigo-500">description</span>
            <div class="flex flex-col">
              <span class="text-xs font-bold text-slate-700 dark:text-slate-300">{name}</span>
              <span class="text-[9px] text-slate-400 font-semibold">{size} | Uploaded: {date}</span>
            </div>
          </div>
          <span class={`px-2 py-0.5 rounded-full text-[9px] font-bold border ${status === 'Verified' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-amber-500/10 text-amber-500 border-amber-500/20'}`}>{status}</span>
        </div>
      );
    }

    function AttendanceRow({ date, in: clockIn, out: clockOut, bio, gps, status }) {
      return (
        <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-900/10 transition-colors">
          <td class="p-4 font-bold text-slate-800 dark:text-white">{date}</td>
          <td class="p-4 font-mono font-semibold">{clockIn}</td>
          <td class="p-4 font-mono font-semibold">{clockOut}</td>
          <td class="p-4">{bio}</td>
          <td class="p-4 font-mono text-slate-400">{gps}</td>
          <td class="p-4">
            <span class={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${status === 'Present' ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : status === 'Punched In' ? 'bg-indigo-500/10 text-indigo-500 border-indigo-500/20' : 'bg-rose-500/10 text-rose-500 border-rose-500/20'}`}>
              {status}
            </span>
          </td>
        </tr>
      );
    }

    function HolidayRow({ title, date, type }) {
      return (
        <div class="flex items-center justify-between p-3 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/20">
          <div class="flex flex-col">
            <span class="text-xs font-bold text-slate-800 dark:text-white">{title}</span>
            <span class="text-[10px] text-slate-400 font-semibold">{type}</span>
          </div>
          <span class="text-xs font-bold font-mono text-indigo-500">{date}</span>
        </div>
      );
    }

    function AlertBox({ title, days, desc, status }) {
      return (
        <div class="p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/30">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-extrabold text-slate-800 dark:text-white">{title}</span>
            <span class={`px-2 py-0.5 rounded-full text-[9px] font-bold border ${status === 'Critical' ? 'bg-rose-500/10 text-rose-500 border-rose-500/20' : 'bg-amber-500/10 text-amber-500 border-amber-500/20'}`}>{status}</span>
          </div>
          <p class="text-xs text-slate-400 mt-1 leading-snug">{desc}</p>
          <span class="text-xs font-mono font-bold text-indigo-500 block mt-2">{days} Days Remaining</span>
        </div>
      );
    }

    function CalendarItem({ title, date, time, type }) {
      return (
        <div class="p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-slate-100/50 dark:hover:bg-slate-900/20 transition-colors">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-lg">calendar_today</span>
            </div>
            <div class="flex flex-col">
              <span class="text-xs font-bold text-slate-800 dark:text-white">{title}</span>
              <span class="text-[10px] text-slate-400 font-semibold uppercase">{type}</span>
            </div>
          </div>
          <span class="text-xs font-bold font-mono text-slate-700 dark:text-slate-300">{date} at {time}</span>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
