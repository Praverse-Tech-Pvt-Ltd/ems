# ─────────────────────────────────────────────────────────────────────────────
# NexGen EMS — Docker Compose
#
# Local dev (uses local postgres + redis):
#   docker compose up --build
#
# Production (uses Neon + Upstash — skip postgres/redis):
#   docker compose --profile prod up --build
#
# Run migrations after first start:
#   docker compose exec api npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL (local dev only — in prod use Neon) ───────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexgen_db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: nexgen
      POSTGRES_PASSWORD: nexgen_dev_pass
      POSTGRES_DB: nexgen_ems
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexgen -d nexgen_ems']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (local dev only — in prod use Upstash) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexgen_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── NestJS API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexgen_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      # Override with Neon URL in prod via .env or Render env vars
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexgen:nexgen_dev_pass@postgres:5432/nexgen_ems?sslmode=disable}
      DIRECT_URL: ${DIRECT_URL:-postgresql://nexgen:nexgen_dev_pass@postgres:5432/nexgen_ems?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_min32chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_min32chars!!!!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change_me_32char_aes_key_prod!!!}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://face-service:8000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: uploads
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@nexgen.in}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js Web ───────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: nexgen_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy

  # ── Python Face Recognition Service (dlib + pgvector) ────────────────────────
  face-service:
    build:
      context: apps/face-service
      dockerfile: Dockerfile
    container_name: nexgen_face
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexgen:nexgen_dev_pass@postgres:5432/nexgen_ems?sslmode=disable}
      RECOGNITION_THRESHOLD: ${RECOGNITION_THRESHOLD:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")"']
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:

