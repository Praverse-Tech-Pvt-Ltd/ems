version: '3.9'

# ── Development compose — hot reload, source mounts ──────────────────────────
# Usage: docker compose -f docker-compose.dev.yml up --build
# Or use: ./scripts/setup.sh

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexgen_db
    environment:
      POSTGRES_USER: nexgen
      POSTGRES_PASSWORD: nexgen_dev_pass
      POSTGRES_DB: nexgen_ems
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexgen -d nexgen_ems']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexgen_redis
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: nexgen_api_dev
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://nexgen:nexgen_dev_pass@postgres:5432/nexgen_ems
      DIRECT_URL: postgresql://nexgen:nexgen_dev_pass@postgres:5432/nexgen_ems
      REDIS_URL: redis://redis:6379
      FACE_SERVICE_URL: http://face-service:8000
      NODE_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy --schema packages/db/prisma/schema.prisma && node apps/api/dist/main.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexgen_web_dev
    env_file: apps/web/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      - api

  face-service:
    build:
      context: apps/face-service
      dockerfile: Dockerfile
    container_name: nexgen_face_dev
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://nexgen:nexgen_dev_pass@postgres:5432/nexgen_ems
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  api_uploads:
