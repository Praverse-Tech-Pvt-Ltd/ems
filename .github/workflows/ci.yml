name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: Type Check & Schema Validate
    runs-on: ubuntu-latest
    env:
      # Prisma validate/generate only need parseable datasource URLs here; the
      # CI job does not connect to a real database.
      DATABASE_URL: postgresql://nexgen:nexgen@localhost:5432/nexgen_ems?schema=public
      DIRECT_URL: postgresql://nexgen:nexgen@localhost:5432/nexgen_ems?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/db/prisma/schema.prisma

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Type check API
        run: npx tsc --noEmit --skipLibCheck
        working-directory: apps/api

      - name: Type check Web
        run: npx tsc --noEmit --skipLibCheck
        working-directory: apps/web
